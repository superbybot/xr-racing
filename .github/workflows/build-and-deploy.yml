name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Sync and clean local repository
        shell: cmd
        working-directory: C:\Users\super\OneDrive\Documents\GitHub\xr-racing-builder
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd

      - name: Build and deploy via Unity batch mode
        shell: cmd
        run: |
          "C:\Program Files\Unity\Hub\Editor\6000.5.2f1\Editor\Unity.exe" -batchmode -quit -nographics -projectPath "C:\Users\super\OneDrive\Documents\GitHub\xr-racing-builder\xr-racing-app" -executeMethod QuestBuildDeploy.BuildAndDeploy -logFile "C:\Users\super\OneDrive\Documents\GitHub\xr-racing-builder\xr-racing-app\Logs\ci-build.log"

      - name: Show build log on failure
        shell: cmd
        if: failure()
        run: type "C:\Users\super\OneDrive\Documents\GitHub\xr-racing-builder\xr-racing-app\Logs\ci-build.log"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr-racing-app-apk
          path: C:/Users/super/OneDrive/Documents/GitHub/xr-racing-builder/xr-racing-app/Builds/Android/*.apk
          if-no-files-found: warn
